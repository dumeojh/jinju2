<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안성여고 수학 수행평가 통합 메뉴</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --bg: #f8f9fa;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 450px;
            border-top: 5px solid var(--accent);
        }

        h1 {
            color: var(--primary);
            margin-top: 0;
            font-size: 1.8em;
            margin-bottom: 10px;
        }

        p {
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        /* 🔒 비밀번호 입력창 및 버튼 스타일 추가 */
        input[type="password"] {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 2px solid var(--accent);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1.1em;
            text-align: center;
            outline: none;
        }

        input[type="password"]:focus {
            border-color: #2980b9;
            box-shadow: 0 0 8px rgba(52, 152, 219, 0.3);
        }

        button {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background: #2980b9;
        }

        select {
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            border: 2px solid var(--accent);
            border-radius: 8px;
            cursor: pointer;
            outline: none;
            background: #fff;
            color: var(--primary);
            font-weight: bold;
            appearance: none;
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%233498db%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E');
            background-repeat: no-repeat;
            background-position: right 15px top 50%;
            background-size: 15px auto;
        }

        select:hover,
        select:focus {
            border-color: #2980b9;
            box-shadow: 0 0 8px rgba(52, 152, 219, 0.3);
        }

        .footer {
            margin-top: 35px;
            font-size: 0.85em;
            color: #bdc3c7;
        }

        /* 메인 컨테이너 초기 숨김 처리 */
        #mainContainer {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container" id="authContainer">
        <h1>🔒 시스템 접근</h1>
        <p>메뉴에 접근하려면 비밀번호를 입력하세요.</p>
        <input type="password" id="adminPwd" placeholder="비밀번호 입력" onkeypress="handleEnter(event)">
        <button onclick="checkPassword()">확인</button>
        <div class="footer">안성여고 수학 수행평가 시스템</div>
    </div>

    <div class="container" id="mainContainer">
        <h1>📐 통합 메뉴 시스템</h1>
        <p>이동할 페이지를 콤보 박스에서 선택해 주세요.</p>

        <select id="menuSelect" onchange="navigateToPage()">
            <option value="">-- 메뉴를 선택하세요 --</option>
            <option value="2026-1-01.html">📝 수행평가 (학생용)</option>
            <option value="dashboard.html">📊 실시간 현황 (교사용)</option>
            <option value="grading.html">✅ 채점 (교사용)</option>
        </select>

        <div class="footer">안성여고 수학 수행평가 시스템</div>
    </div>

    <script>
        // 비밀번호 체크 로직
        function checkPassword() {
            const pwd = document.getElementById('adminPwd').value;
            if (pwd === "12345") {
                // 비밀번호가 맞으면 인증 화면을 숨기고 메인 화면을 보여줌
                document.getElementById('authContainer').style.display = 'none';
                document.getElementById('mainContainer').style.display = 'block';
            } else {
                alert("🚨 비밀번호가 일치하지 않습니다.");
                document.getElementById('adminPwd').value = '';
                document.getElementById('adminPwd').focus();
            }
        }

        // 엔터키 지원 로직
        function handleEnter(event) {
            if (event.key === 'Enter') {
                checkPassword();
            }
        }

        function navigateToPage() {
            const selectBox = document.getElementById('menuSelect');
            const targetUrl = selectBox.value;

            if (targetUrl) {
                window.open(targetUrl, '_blank');
                setTimeout(() => { selectBox.value = ""; }, 100);
            }
        }
    </script>

</body>

</html>
