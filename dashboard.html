<!DOCTYPE html>
<html lang="ko">

<head>




    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안성여고 실시간 현황 대시보드</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --bg: #f8f9fa;
        }




        body {
            font-family: 'Pretendard', sans-serif;
            background: var(--bg);
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: var(--primary);
            text-align: center;
            margin-top: 0;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        /* 필터 섹션 스타일 */
        .filter-section {
            background: #f1f4f8;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-group label {
            font-weight: bold;
            color: var(--primary);
        }

        .filter-group select,
        .filter-group input[type="date"] {
            padding: 8px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            background: white;
            font-size: 1em;
            cursor: pointer;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: bold;
            color: #555;
        }

        .refresh-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .refresh-btn:hover {
            background: #2980b9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 1.05em;
        }

        th,
        td {
            padding: 12px 10px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: var(--primary);
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        /* 상태별 행 스타일 */
        .row-empty {
            color: #ccc;
            background-color: #fafafa;
        }

        /* 미접속 */
        .row-active {
            background-color: #fff;
            color: #2c3e50;
        }

        /* 진행 중 또는 완료 */
        tr:hover {
            background-color: #f1f7fd;
        }

        .status-ing {
            color: #e67e22;
            font-weight: bold;
            background: #fdf2e9;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.9em;
        }

        .status-done {
            color: #27ae60;
            font-weight: bold;
            background: #e9f7ef;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.9em;
        }

        .status-waiting {
            color: #bdc3c7;
            font-size: 0.9em;
        }

        .no-data {
            padding: 50px;
            color: #a0aec0;
            font-weight: bold;
            font-size: 1.1em;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>📊 안성여고 수행평가 실시간 관제 센터</h1>

        <div class="filter-section">
            <div class="filter-group">
                <label>학기</label>
                <select id="filterSemester" onchange="fetchData()">
                    <option value="2">2학기</option>
                    <option value="1">1학기</option>
                </select>
            </div>

            <div class="filter-group">
                <label>날짜</label>
                <input type="date" id="filterDate" onchange="fetchData()">
            </div>

            <div class="filter-group">
                <label>학년</label>
                <select id="filterGrade" onchange="fetchData()">
                    <option value="">-- 선택 --</option>
                    <option value="1">1학년</option>
                    <option value="2">2학년</option>
                    <option value="3">3학년</option>
                </select>
            </div>

            <div class="filter-group">
                <label>반</label>
                <select id="filterClass" onchange="fetchData()">
                    <option value="">-- 선택 --</option>
                    <option value="1">1반</option>
                    <option value="2">2반</option>
                    <option value="3">3반</option>
                    <option value="4">4반</option>
                    <option value="5">5반</option>
                    <option value="6">6반</option>
                    <option value="7">7반</option>
                    <option value="8">8반</option>
                    <option value="9">9반</option>
                    <option value="10">10반</option>
                    <option value="11">11반</option>
                    <option value="12">12반</option>
                </select>
            </div>
        </div>

        <div class="status-header">
            <span id="lastUpdated">대기 중 (학년/반을 선택하세요)</span>
            <div>
                <span style="font-size: 0.85em; margin-right: 10px; color: #7f8c8d;">(5초 자동 갱신)</span>
                <button class="refresh-btn" onclick="fetchData()">🔄 즉시 새로고침</button>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th width="80">번호</th>
                    <th width="120">이름</th>
                    <th width="150">상태</th>
                    <th>시작 시간</th>
                    <th>종료 시간</th>
                    <th>소요 시간</th>
                    <th width="220">비고 (경고현황)</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="7" class="no-data">👆 상단에서 모니터링할 학년과 반을 모두 선택해 주세요.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="config.js"></script>
    <script>
        /** ============================================================================
         *  실시간 현황판 — 수파베이스 버전
         *  · exam_logs_*  : 시험 시작(start) / 이탈 경고(warning) 기록
         *  · submissions_*: 제출 완료 여부와 종료 시각
         *  · students     : 명렬표(학년·반·번호·이름) — 미접속자까지 정확히 표시
         * ========================================================================== */

        function currentTables() {
            const sem = document.getElementById('filterSemester').value;
            return sem === '1'
                ? { logs: SB_TABLE_LOGS_1, subs: SB_TABLE_SUBMISSIONS_1 }
                : { logs: SB_TABLE_LOGS_2, subs: SB_TABLE_SUBMISSIONS_2 };
        }

        document.addEventListener("DOMContentLoaded", () => {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            document.getElementById('filterDate').value = `${year}-${month}-${day}`;

            if (!SB_READY) {
                document.getElementById('lastUpdated').innerText =
                    "⚠️ config.js에 수파베이스 주소와 키를 먼저 입력해 주세요.";
            }
        });

        /* 타임스탬프 → 'YYYY-MM-DD' (내 컴퓨터 시간 기준) */
        function toDateStr(ts) {
            if (!ts) return "";
            const d = new Date(ts);
            if (isNaN(d)) return "";
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function formatDate(ts) {
            if (!ts) return "-";
            const d = new Date(ts);
            if (isNaN(d)) return "-";
            return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;
        }

        function elapsed(startTs, endTs) {
            if (!startTs || !endTs) return "-";
            const ms = new Date(endTs) - new Date(startTs);
            if (isNaN(ms) || ms < 0) return "-";
            const min = Math.floor(ms / 60000);
            const sec = Math.floor((ms % 60000) / 1000);
            return `${min}분 ${String(sec).padStart(2, '0')}초`;
        }

        let isFetching = false;

        async function fetchData() {
            const selectedDate = document.getElementById('filterDate').value;
            const selectedGrade = document.getElementById('filterGrade').value;
            const selectedClass = document.getElementById('filterClass').value;
            const tbody = document.getElementById('tableBody');

            if (!selectedGrade || !selectedClass) {
                tbody.innerHTML = '<tr><td colspan="7" class="no-data">👆 모니터링할 학년과 반을 모두 선택해 주세요.</td></tr>';
                return;
            }
            if (!SB_READY || isFetching) return;
            isFetching = true;

            const { logs: T_LOGS, subs: T_SUBS } = currentTables();
            const q = `select=*&grade=eq.${selectedGrade}&stu_class=eq.${selectedClass}`;

            try {
                /* 로그는 반드시 필요, 답안 조회는 막혀 있을 수 있으므로 실패해도 진행 */
                const [logRows, subRows, roster] = await Promise.all([
                    sbSelect(T_LOGS, q + '&order=created_at.asc'),
                    sbSelect(T_SUBS, q + '&order=created_at.asc').catch(() => []),
                    sbStudentsOf(selectedGrade, selectedClass).catch(() => [])
                ]);

                const inDay = r => !selectedDate || toDateStr(r.created_at) === selectedDate;
                const dayLogs = logRows.filter(inDay);
                const daySubs = subRows.filter(inDay);

                /* ---- 번호별로 정리 ---- */
                const rec = {};   // 번호 → 현황
                const touch = n => (rec[n] = rec[n] || {
                    name: '', start: null, end: null, attempts: 0,
                    maxWarning: 0, forced: false, timeout: false, submitType: ''
                });

                dayLogs.forEach(r => {
                    const n = parseInt(r.stu_num);
                    if (isNaN(n)) return;
                    const s = touch(n);
                    if (r.stu_name) s.name = r.stu_name;

                    if (r.event === 'start') {
                        s.attempts++;
                        if (!s.start) s.start = r.created_at;
                    } else if (r.event === 'warning') {
                        const msg = String(r.message || '');
                        if (msg.includes('강제제출')) {
                            s.forced = true;
                            s.maxWarning = 30;
                        } else {
                            const m = msg.match(/(\d+)차경고/);
                            if (m) s.maxWarning = Math.max(s.maxWarning, parseInt(m[1]));
                        }
                    }
                });

                daySubs.forEach(r => {
                    const n = parseInt(r.stu_num);
                    if (isNaN(n)) return;
                    const s = touch(n);
                    if (r.stu_name) s.name = r.stu_name;
                    s.end = r.created_at;
                    s.submitType = r.submit_type || '';
                    if (s.submitType.includes('시간초과')) s.timeout = true;
                    if (s.submitType.includes('강제제출')) s.forced = true;
                    if (typeof r.warn_count === 'number') s.maxWarning = Math.max(s.maxWarning, r.warn_count);
                });

                /* ---- 표에 그릴 번호 목록 : 명렬표 우선, 없으면 1~35번 ---- */
                const rosterMap = {};
                roster.forEach(s => { rosterMap[parseInt(s.num)] = s.name; });

                let baseNums = roster.length
                    ? roster.map(s => parseInt(s.num)).filter(n => !isNaN(n))
                    : Array.from({ length: 35 }, (_, i) => i + 1);

                const extraNums = Object.keys(rec).map(Number)
                    .filter(n => !baseNums.includes(n))
                    .sort((a, b) => a - b);

                tbody.innerHTML = '';

                const renderRow = (num, isErrorRow = false) => {
                    const s = rec[num];
                    const tr = document.createElement('tr');
                    const rosterName = rosterMap[num] || '';

                    if (!s) {
                        tr.className = 'row-empty';
                        tr.innerHTML = `
                        <td>${num}</td>
                        <td>${rosterName || '-'}</td>
                        <td><span class="status-waiting">미접속</span></td>
                        <td>-</td><td>-</td><td>-</td><td>-</td>`;
                        return tr;
                    }

                    tr.className = 'row-active';
                    if (isErrorRow) tr.style.backgroundColor = '#fff9e6';

                    const isDone = !!s.end;
                    const statusHtml = isDone
                        ? `<span class="status-done">🔵 제출 완료</span>`
                        : `<span class="status-ing">🟢 진행 중</span>`;

                    let remark;
                    if (s.forced) remark = "🚨 화면이탈 누적 (강제제출)";
                    else if (s.maxWarning >= 3) remark = `🚨 ${s.maxWarning}회 화면이탈 (위험)`;
                    else if (s.timeout) remark = "⏳ 시간초과 (자동제출)";
                    else if (s.maxWarning === 2) remark = isDone ? "⚠️ 2회 이탈 후 정상제출" : "⚠️ 2회 화면이탈 (위험)";
                    else if (s.maxWarning === 1) remark = isDone ? "⚠️ 1회 이탈 후 정상제출" : "⚠️ 1회 화면이탈 (주의)";
                    else if (isDone) remark = "✅ 무결점 정상제출";
                    else remark = "🟢 정상 진행 중";

                    const attemptBadge = s.attempts > 1
                        ? `<br><span style="font-size:0.8em; color:#8e44ad; font-weight:bold;">(🔄 총 ${s.attempts}회 응시)</span>`
                        : "";

                    const displayNum = isErrorRow
                        ? `<b style="color:#e74c3c; font-size:1.1em;">${num}</b>`
                        : `<b>${num}</b>`;

                    tr.innerHTML = `
                    <td>${displayNum}</td>
                    <td>${rosterName || s.name || '-'}${attemptBadge}</td>
                    <td>${statusHtml}</td>
                    <td>${formatDate(s.start)}</td>
                    <td>${formatDate(s.end)}</td>
                    <td>${elapsed(s.start, s.end)}</td>
                    <td style="font-weight:bold; color:${getRemarkColor(remark)};">${remark}</td>`;
                    return tr;
                };

                baseNums.sort((a, b) => a - b).forEach(n => tbody.appendChild(renderRow(n, false)));

                if (extraNums.length > 0) {
                    const trSep = document.createElement('tr');
                    trSep.innerHTML = `<td colspan="7" style="background:#ffeaa7; color:#d35400; font-weight:bold; letter-spacing:1px; padding: 15px;">⚠️ 번호 입력 오류 학생 (확인 필요)</td>`;
                    tbody.appendChild(trSep);
                    extraNums.forEach(n => tbody.appendChild(renderRow(n, true)));
                }

                const lockedNote = (subRows.length === 0 && dayLogs.length > 0)
                    ? " · (답안 조회가 잠겨 있으면 종료 시각이 비어 보일 수 있습니다)"
                    : "";
                document.getElementById('lastUpdated').innerText =
                    `마지막 업데이트: ${new Date().toLocaleTimeString()}${lockedNote}`;

            } catch (error) {
                console.error("데이터 로드 실패:", error);
                document.getElementById('lastUpdated').innerText = "데이터 갱신 오류: " + error.message;
            } finally {
                isFetching = false;
            }
        }

        function getRemarkColor(remark) {
            if (remark.includes("강제제출")) return "#e74c3c";
            if (remark.includes("시간초과")) return "#8e44ad";
            if (remark.includes("2회 이탈") || remark.includes("2회 화면이탈")) return "#e67e22";
            if (remark.includes("1회 이탈") || remark.includes("1회 화면이탈")) return "#d35400";
            if (remark.includes("무결점") || remark.includes("진행 중")) return "#27ae60";
            return "#555";
        }

        setInterval(fetchData, 5000);
    </script>
</body>

</html>
