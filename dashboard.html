<!DOCTYPE html>
<html lang="ko">

<head>


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안성여고 실시간 현황 대시보드</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --bg: #f8f9fa;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background: var(--bg);
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: var(--primary);
            text-align: center;
            margin-top: 0;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        /* 필터 섹션 스타일 */
        .filter-section {
            background: #f1f4f8;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-group label {
            font-weight: bold;
            color: var(--primary);
        }

        .filter-group select,
        .filter-group input[type="date"] {
            padding: 8px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            background: white;
            font-size: 1em;
            cursor: pointer;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: bold;
            color: #555;
        }

        .refresh-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .refresh-btn:hover {
            background: #2980b9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 1.05em;
        }

        th,
        td {
            padding: 12px 10px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: var(--primary);
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        /* 상태별 행 스타일 */
        .row-empty {
            color: #ccc;
            background-color: #fafafa;
        }

        /* 미접속 */
        .row-active {
            background-color: #fff;
            color: #2c3e50;
        }

        /* 진행 중 또는 완료 */
        tr:hover {
            background-color: #f1f7fd;
        }

        .status-ing {
            color: #e67e22;
            font-weight: bold;
            background: #fdf2e9;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.9em;
        }

        .status-done {
            color: #27ae60;
            font-weight: bold;
            background: #e9f7ef;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.9em;
        }

        .status-waiting {
            color: #bdc3c7;
            font-size: 0.9em;
        }

        .no-data {
            padding: 50px;
            color: #a0aec0;
            font-weight: bold;
            font-size: 1.1em;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>📊 안성여고 수행평가 실시간 관제 센터</h1>

        <div class="filter-section">
            <div class="filter-group">
                <label>날짜</label>
                <input type="date" id="filterDate" onchange="fetchData()">
            </div>

            <div class="filter-group">
                <label>학년</label>
                <select id="filterGrade" onchange="fetchData()">
                    <option value="">-- 선택 --</option>
                    <option value="1">1학년</option>
                    <option value="2">2학년</option>
                    <option value="3">3학년</option>
                </select>
            </div>

            <div class="filter-group">
                <label>반</label>
                <select id="filterClass" onchange="fetchData()">
                    <option value="">-- 선택 --</option>
                    <option value="1">1반</option>
                    <option value="2">2반</option>
                    <option value="3">3반</option>
                    <option value="4">4반</option>
                    <option value="5">5반</option>
                    <option value="6">6반</option>
                    <option value="7">7반</option>
                    <option value="8">8반</option>
                    <option value="9">9반</option>
                    <option value="10">10반</option>
                    <option value="11">11반</option>
                    <option value="12">12반</option>
                </select>
            </div>
        </div>

        <div class="status-header">
            <span id="lastUpdated">대기 중 (학년/반을 선택하세요)</span>
            <div>
                <span style="font-size: 0.85em; margin-right: 10px; color: #7f8c8d;">(5초 자동 갱신)</span>
                <button class="refresh-btn" onclick="fetchData()">🔄 즉시 새로고침</button>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th width="80">번호</th>
                    <th width="120">이름</th>
                    <th width="150">상태</th>
                    <th>시작 시간</th>
                    <th>종료 시간</th>
                    <th>소요 시간</th>
                    <th width="220">비고 (경고현황)</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="7" class="no-data">👆 상단에서 모니터링할 학년과 반을 모두 선택해 주세요.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="config.js"></script>
    <script>
        const GOOGLE_SCRIPT_URL = BASE_SCRIPT_URL + "?sheet=status";

        const HISTORY_KEY = 'anseong_dashboard_warnings_v2';
        let globalWarningMap = JSON.parse(localStorage.getItem(HISTORY_KEY)) || {};

        document.addEventListener("DOMContentLoaded", () => {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            document.getElementById('filterDate').value = `${year}-${month}-${day}`;
        });

        function extractDateString(dateValue) {
            if (!dateValue || dateValue === "-") return "";
            const d = new Date(dateValue);
            if (isNaN(d)) return "";
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        async function fetchData() {
            const selectedDate = document.getElementById('filterDate').value;
            const selectedGrade = document.getElementById('filterGrade').value;
            const selectedClass = document.getElementById('filterClass').value;
            const tbody = document.getElementById('tableBody');

            if (!selectedGrade || !selectedClass) {
                tbody.innerHTML = '<tr><td colspan="7" class="no-data">👆 모니터링할 학년과 반을 모두 선택해 주세요.</td></tr>';
                return;
            }

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                const data = await response.json();

                const classData = data.filter(row => {
                    const rowGrade = String(row['학년'] || "");
                    const rowClass = String(row['반'] || "");
                    const rowDate = extractDateString(row['시작시간'] || row['시작 시간']);

                    const matchGrade = (rowGrade === selectedGrade || rowGrade === selectedGrade + "학년");
                    const matchClass = (rowClass === selectedClass || rowClass === selectedClass + "반");
                    const matchDate = selectedDate ? (rowDate === selectedDate) : true;

                    return matchGrade && matchClass && matchDate;
                });

                const attemptCounts = {};

                classData.forEach(row => {
                    const grade = String(row['학년'] || "").replace('학년', '');
                    const cls = String(row['반'] || "").replace('반', '');
                    const num = parseInt(row['번호']);
                    const startTime = row['시작시간'] || row['시작 시간'] || "unknown";

                    const sessionKey = `${grade}_${cls}_${num}_${startTime}`;

                    // 응시 횟수 1씩 증가
                    attemptCounts[num] = (attemptCounts[num] || 0) + 1;

                    if (!globalWarningMap[sessionKey]) {
                        globalWarningMap[sessionKey] = 0;
                    }

                    const remark = row['비고'] || "";

                    if (remark.includes("강제제출")) {
                        globalWarningMap[sessionKey] = 30; // 강제 제출은 최대치인 30으로 기록
                    } else if (remark.includes("차경고")) {
                        const warningMatch = remark.match(/(\d+)차경고/);
                        if (warningMatch) {
                            const currentWarning = parseInt(warningMatch[1]);
                            if (globalWarningMap[sessionKey] < currentWarning) {
                                globalWarningMap[sessionKey] = currentWarning;
                            }
                        }
                    }
                });

                localStorage.setItem(HISTORY_KEY, JSON.stringify(globalWarningMap));

                const studentMap = {};
                classData.forEach(row => {
                    studentMap[parseInt(row['번호'])] = row;
                });

                tbody.innerHTML = '';

                // 공통 로직을 함수로 분리 (유지보수 용이)
                const renderRow = (num, student, isErrorRow = false) => {
                    const tr = document.createElement('tr');
                    if (!student) {
                        tr.className = 'row-empty';
                        tr.innerHTML = `
                        <td>${num}</td>
                        <td>-</td>
                        <td><span class="status-waiting">미접속</span></td>
                        <td>-</td><td>-</td><td>-</td><td>-</td>
                    `;
                        return tr;
                    }

                    tr.className = 'row-active';
                    if (isErrorRow) tr.style.backgroundColor = '#fff9e6'; // 오류 학생 배경색

                    let statusRaw = student['상태'] || '-';
                    let isDone = statusRaw.includes('제출 완료');
                    let statusHtml = statusRaw.includes('진행 중')
                        ? `<span class="status-ing">🟢 진행 중</span>`
                        : `<span class="status-done">🔵 제출 완료</span>`;

                    let rawRemark = student['비고'] || '';
                    const grade = String(student['학년'] || "").replace('학년', '');
                    const cls = String(student['반'] || "").replace('반', '');
                    const startTime = student['시작시간'] || student['시작 시간'] || "unknown";
                    const sessionKey = `${grade}_${cls}_${num}_${startTime}`;
                    const maxWarning = globalWarningMap[sessionKey] || 0;

                    let displayRemark = "정상상태";

                    // 💡 수정된 부분: maxWarning === 3 대신 >= 3 으로 변경하여 4회 이상도 모두 처리
                    if (rawRemark.includes("강제제출")) {
                        displayRemark = "🚨 화면이탈 누적 (강제제출)";
                    } else if (maxWarning >= 3) {
                        displayRemark = `🚨 ${maxWarning}회 화면이탈 (위험)`;
                    } else if (rawRemark.includes("시간초과")) {
                        displayRemark = "⏳ 시간초과 (자동제출)";
                    } else if (maxWarning === 2) {
                        displayRemark = isDone ? "⚠️ 2회 이탈 후 정상제출" : "⚠️ 2회 화면이탈 (위험)";
                    } else if (maxWarning === 1) {
                        displayRemark = isDone ? "⚠️ 1회 이탈 후 정상제출" : "⚠️ 1회 화면이탈 (주의)";
                    } else if (rawRemark.includes("정상제출") || (isDone && (rawRemark === "" || rawRemark === "정상상태"))) {
                        displayRemark = "✅ 무결점 정상제출";
                    } else if (statusRaw.includes("진행 중")) {
                        displayRemark = "🟢 정상 진행 중";
                    } else {
                        displayRemark = rawRemark || "정상상태";
                    }

                    let attemptBadge = attemptCounts[num] > 1
                        ? `<br><span style="font-size:0.8em; color:#8e44ad; font-weight:bold;">(🔄 총 ${attemptCounts[num]}회 응시)</span>`
                        : "";

                    let displayNum = isErrorRow ? `<b style="color:#e74c3c; font-size:1.1em;">${num}</b>` : `<b>${num}</b>`;

                    tr.innerHTML = `
                    <td>${displayNum}</td>
                    <td>${student['이름'] || '-'}${attemptBadge}</td>
                    <td>${statusHtml}</td>
                    <td>${formatDate(student['시작시간'] || student['시작 시간'])}</td>
                    <td>${formatDate(student['종료시간'] || student['종료 시간'])}</td>
                    <td>${student['소요시간'] || student['소요 시간'] || '-'}</td>
                    <td style="font-weight:bold; color:${getRemarkColor(displayRemark)};">${displayRemark}</td>
                `;
                    return tr;
                };

                // 1번부터 35번까지 렌더링
                for (let i = 1; i <= 35; i++) {
                    tbody.appendChild(renderRow(i, studentMap[i], false));
                }

                // 번호 입력 오류 학생 렌더링
                const errorNums = Object.keys(studentMap).map(Number).filter(n => n > 35 || n < 1).sort((a, b) => a - b);
                if (errorNums.length > 0) {
                    const trSep = document.createElement('tr');
                    trSep.innerHTML = `<td colspan="7" style="background:#ffeaa7; color:#d35400; font-weight:bold; letter-spacing:1px; padding: 15px;">⚠️ 번호 입력 오류 학생 (확인 필요)</td>`;
                    tbody.appendChild(trSep);

                    errorNums.forEach(num => {
                        tbody.appendChild(renderRow(num, studentMap[num], true));
                    });
                }

                updateTime();
            } catch (error) {
                console.error("데이터 로드 실패:", error);
                document.getElementById('lastUpdated').innerText = "데이터 갱신 오류";
            }
        }

        function formatDate(dateString) {
            if (!dateString || dateString === "-") return "-";
            const d = new Date(dateString);
            if (isNaN(d)) return dateString;
            return `${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}:${d.getSeconds().toString().padStart(2, '0')}`;
        }

        // 💡 수정된 부분: 경고 문구가 바뀌어도 색상이 확실히 들어가도록 키워드 변경
        function getRemarkColor(remark) {
            if (remark.includes("강제제출")) return "#e74c3c"; // 아웃: 빨강
            if (remark.includes("시간초과")) return "#8e44ad"; // 초과: 보라
            if (remark.includes("2회 이탈") || remark.includes("2회 화면이탈")) return "#e67e22"; // 위험: 주황
            if (remark.includes("1회 이탈") || remark.includes("1회 화면이탈")) return "#d35400"; // 주의: 진한 주황/노랑
            if (remark.includes("무결점") || remark.includes("진행 중")) return "#27ae60"; // 정상: 초록
            return "#555";
        }

        function updateTime() {
            const now = new Date();
            document.getElementById('lastUpdated').innerText = `마지막 업데이트: ${now.toLocaleTimeString()}`;
        }

        setInterval(fetchData, 5000);
    </script>
</body>

</html>
